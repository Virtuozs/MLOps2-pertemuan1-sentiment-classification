[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=2.4.0",
    "jinja2>=3.1.6",
    "fastapi>=0.115.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "psutil>=7.2.2",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.6.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.24.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
